<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <linearGradient id="silkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366" />
      <stop offset="35%" stop-color="#FF9900" />
      <stop offset="70%" stop-color="#00D2B4" />
      <stop offset="100%" stop-color="#3A86FF" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB703" />
      <stop offset="100%" stop-color="#FB8500" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#FF3366" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Shuttle & Silk Ribbon Icon -->
  <g transform="translate(10, 10)">
    <!-- Loom Shuttle Wood Base -->
    <path d="M 12 30 C 5 22, 5 12, 18 10 C 35 7, 45 7, 56 16 C 59 19, 58 24, 52 27 C 40 33, 25 35, 12 30 Z" fill="#D4A373" stroke="#8C5329" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Shuttle eyelet slot -->
    <rect x="25" y="16" width="16" height="6" rx="3" fill="#FFF7ED" stroke="#8C5329" stroke-width="1.5"/>
    <circle cx="33" cy="19" r="2.5" fill="#FF5E7E"/>
    
    <!-- Flowing Rainbow Silk Ribbon -->
    <path d="M 33 20 C 45 35, 20 48, 48 55 C 65 60, 68 45, 60 38 C 55 33, 40 25, 48 10" fill="none" stroke="url(#silkGrad)" stroke-width="5.5" stroke-linecap="round" filter="url(#softGlow)"/>
    <path d="M 36 21 C 46 34, 23 46, 49 53" fill="none" stroke="#FFF" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>

    <!-- Little Sparkle -->
    <polygon points="56,8 58,13 63,14 59,17 60,22 56,19 51,22 53,17 49,13 54,12" fill="#FFD166"/>
  </g>

  <!-- Typography -->
  <g transform="translate(85, 20)">
    <!-- Main Brand Name -->
    <text x="0" y="32" font-family="'Baloo 2', 'Quicksand', 'Nunito', 'Segoe UI', sans-serif" font-size="34" font-weight="900" fill="#2B2D42" letter-spacing="-0.5">
      Lega<tspan fill="#FF3366">silk</tspan>
    </text>
    
    <!-- Cute Tagline / Badge -->
    <rect x="135" y="12" width="88" height="20" rx="10" fill="#FFF0F5" stroke="#FF5E7E" stroke-width="1.5"/>
    <text x="179" y="26" font-family="'Quicksand', sans-serif" font-size="10.5" font-weight="800" fill="#D90429" text-anchor="middle">
      VẠN PHÚC
    </text>

    <!-- Sub-label -->
    <text x="2" y="46" font-family="'Quicksand', 'Nunito', sans-serif" font-size="11" font-weight="700" fill="#6C757D" letter-spacing="1">
      LÀNG NGHỀ TRONG TẦM TAY EM
    </text>
  </g>
</svg>
