<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 420" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBE3FB"/>
      <stop offset="60%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#FFEED9"/>
    </linearGradient>
    <linearGradient id="gateRoofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C84B31"/>
      <stop offset="100%" stop-color="#801313"/>
    </linearGradient>
    <linearGradient id="gateWallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2D398"/>
      <stop offset="100%" stop-color="#D4A373"/>
    </linearGradient>
    <linearGradient id="silkDrying1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF007F"/>
      <stop offset="100%" stop-color="#FF758F"/>
    </linearGradient>
    <linearGradient id="silkDrying2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB703"/>
      <stop offset="100%" stop-color="#FDFFB6"/>
    </linearGradient>
    <linearGradient id="silkDrying3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00D2B4"/>
      <stop offset="100%" stop-color="#80FFDB"/>
    </linearGradient>
    <linearGradient id="silkDrying4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7B2CBF"/>
      <stop offset="100%" stop-color="#C77DFF"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#2D3748" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect x="0" y="0" width="650" height="420" rx="24" fill="url(#skyGrad)"/>

  <!-- Golden Sun -->
  <circle cx="530" cy="90" r="45" fill="#FFEAA7" opacity="0.8"/>
  <circle cx="530" cy="90" r="35" fill="#FDCB6E"/>

  <!-- Distant Fluffy Clouds -->
  <g fill="#FFFFFF" opacity="0.85">
    <path d="M 60 70 Q 75 55 95 60 Q 115 50 135 65 Q 155 60 165 75 Q 170 90 150 95 L 70 95 Q 50 90 60 70 Z"/>
    <path d="M 400 60 Q 412 48 428 52 Q 444 44 460 56 Q 476 52 484 64 Q 488 76 472 80 L 408 80 Q 392 76 400 60 Z" opacity="0.7"/>
  </g>

  <!-- Distant Pagoda & Village Silhouettes -->
  <path d="M 480 260 L 495 240 L 510 260 L 510 280 L 480 280 Z" fill="#D3D3D3" opacity="0.5"/>

  <!-- River Bank (Sông Nhuệ) with lush greenery -->
  <path d="M 0 350 Q 150 320 300 340 T 650 330 L 650 420 L 0 420 Z" fill="#A7D489"/>
  <!-- River water ribbon -->
  <path d="M 0 380 Q 200 360 400 385 T 650 370 L 650 420 L 0 420 Z" fill="#81D4FA" opacity="0.75"/>
  <path d="M 30 395 Q 180 385 350 400 T 620 388" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.8"/>

  <!-- Traditional Van Phuc Village Gate (Cổng làng Vạn Phúc) -->
  <g transform="translate(190, 110)" filter="url(#softShadow)">
    <!-- Gate Base Pillars -->
    <rect x="30" y="80" width="38" height="150" fill="url(#gateWallGrad)" stroke="#8C5329" stroke-width="3"/>
    <rect x="202" y="80" width="38" height="150" fill="url(#gateWallGrad)" stroke="#8C5329" stroke-width="3"/>
    
    <!-- Central Arch Way -->
    <path d="M 68 120 Q 135 75 202 120 L 202 230 L 68 230 Z" fill="#ECC695" stroke="#8C5329" stroke-width="3"/>
    <path d="M 80 135 Q 135 95 190 135 L 190 230 L 80 230 Z" fill="#4A3428" opacity="0.2"/>

    <!-- Horizontal Arch Beam with Village Name -->
    <rect x="55" y="70" width="160" height="35" rx="5" fill="#801313" stroke="#520505" stroke-width="2.5"/>
    <text x="135" y="93" font-family="'Baloo 2', 'Quicksand', sans-serif" font-size="15" font-weight="900" fill="#FFD166" text-anchor="middle" letter-spacing="1">
      LÀNG LỤA VẠN PHÚC
    </text>

    <!-- Lower Tier Curved Tile Roof -->
    <path d="M 15 70 C 45 45, 100 45, 135 45 C 170 45, 225 45, 255 70 Q 260 74 245 74 L 25 74 Q 10 74 15 70 Z" 
          fill="url(#gateRoofGrad)" stroke="#520505" stroke-width="3"/>
    <!-- Roof upturned dragons / curved horns -->
    <path d="M 15 70 Q 5 50 0 45 Q 8 60 22 66" fill="#FFD166" stroke="#8C5329" stroke-width="1.5"/>
    <path d="M 255 70 Q 265 50 270 45 Q 262 60 248 66" fill="#FFD166" stroke="#8C5329" stroke-width="1.5"/>

    <!-- Upper Pavilion Story -->
    <rect x="75" y="15" width="120" height="35" rx="3" fill="url(#gateWallGrad)" stroke="#8C5329" stroke-width="2.5"/>
    <circle cx="135" cy="32" r="10" fill="#801313"/>
    <circle cx="135" cy="32" r="6" fill="#FFD166"/>

    <!-- Upper Main Roof with curved edges -->
    <path d="M 50 18 C 80 -5, 120 -5, 135 -5 C 150 -5, 190 -5, 220 18 Q 225 22 215 22 L 55 22 Q 45 22 50 18 Z" 
          fill="url(#gateRoofGrad)" stroke="#520505" stroke-width="3"/>
    <path d="M 50 18 Q 35 2 28 -4 Q 38 10 54 15" fill="#FFD166" stroke="#8C5329" stroke-width="1.5"/>
    <path d="M 220 18 Q 235 2 242 -4 Q 232 10 216 15" fill="#FFD166" stroke="#8C5329" stroke-width="1.5"/>
  </g>

  <!-- Colorful Hanging Umbrellas Street (Con đường ô lụa sắc màu nổi tiếng Vạn Phúc) -->
  <g transform="translate(0, 0)">
    <!-- Hanging guide wires -->
    <path d="M 0 50 Q 150 90 300 65 Q 450 95 650 60" fill="none" stroke="#A0AEC0" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- Umbrella 1: Magenta Pink -->
    <g transform="translate(60, 65) scale(0.75)" filter="url(#softShadow)">
      <path d="M 0 35 C 0 10, 25 0, 50 0 C 75 0, 100 10, 100 35 Z" fill="#FF007F" stroke="#B8005A" stroke-width="2"/>
      <line x1="50" y1="35" x2="50" y2="60" stroke="#555" stroke-width="2.5"/>
      <path d="M 50 60 Q 50 68 56 68" fill="none" stroke="#555" stroke-width="2.5"/>
    </g>

    <!-- Umbrella 2: Sunshine Yellow -->
    <g transform="translate(130, 80) scale(0.68)" filter="url(#softShadow)">
      <path d="M 0 35 C 0 10, 25 0, 50 0 C 75 0, 100 35, 100 35 Z" fill="#FFB703" stroke="#D48B00" stroke-width="2"/>
      <line x1="50" y1="35" x2="50" y2="60" stroke="#555" stroke-width="2.5"/>
      <path d="M 50 60 Q 50 68 56 68" fill="none" stroke="#555" stroke-width="2.5"/>
    </g>

    <!-- Umbrella 3: Cyan Green -->
    <g transform="translate(450, 75) scale(0.72)" filter="url(#softShadow)">
      <path d="M 0 35 C 0 10, 25 0, 50 0 C 75 0, 100 35, 100 35 Z" fill="#00D2B4" stroke="#009688" stroke-width="2"/>
      <line x1="50" y1="35" x2="50" y2="60" stroke="#555" stroke-width="2.5"/>
      <path d="M 50 60 Q 50 68 56 68" fill="none" stroke="#555" stroke-width="2.5"/>
    </g>

    <!-- Umbrella 4: Violet Purple -->
    <g transform="translate(530, 65) scale(0.75)" filter="url(#softShadow)">
      <path d="M 0 35 C 0 10, 25 0, 50 0 C 75 0, 100 35, 100 35 Z" fill="#9D4EDD" stroke="#6A1B9A" stroke-width="2"/>
      <line x1="50" y1="35" x2="50" y2="60" stroke="#555" stroke-width="2.5"/>
      <path d="M 50 60 Q 50 68 56 68" fill="none" stroke="#555" stroke-width="2.5"/>
    </g>
  </g>

  <!-- Hanging Silk Rolls drying in the breeze (Phơi lụa tơ tằm) -->
  <!-- Left Side Silk Rack -->
  <g transform="translate(40, 180)" filter="url(#softShadow)">
    <!-- Wooden Drying Bamboo Stand -->
    <line x1="0" y1="40" x2="130" y2="40" stroke="#8C5329" stroke-width="5" stroke-linecap="round"/>
    <line x1="15" y1="40" x2="5" y2="170" stroke="#8C5329" stroke-width="5" stroke-linecap="round"/>
    <line x1="115" y1="40" x2="125" y2="170" stroke="#8C5329" stroke-width="5" stroke-linecap="round"/>

    <!-- Silk Strip 1 (Ruby Red) -->
    <path d="M 20 40 Q 32 100 28 150 Q 38 155 48 150 Q 42 100 48 40 Z" fill="url(#silkDrying1)" opacity="0.95"/>
    <!-- Silk Strip 2 (Golden Yellow) -->
    <path d="M 52 40 Q 64 95 60 160 Q 70 165 80 160 Q 74 95 80 40 Z" fill="url(#silkDrying2)" opacity="0.95"/>
    <!-- Silk Strip 3 (Emerald Green) -->
    <path d="M 85 40 Q 97 100 93 145 Q 103 150 113 145 Q 107 100 113 40 Z" fill="url(#silkDrying3)" opacity="0.95"/>
  </g>

  <!-- Right Side: Mulberry Tree (Cây dâu tằm cổ thụ) -->
  <g transform="translate(490, 200)">
    <!-- Trunk -->
    <path d="M 70 150 Q 60 90 40 50 Q 80 80 70 150 Z" fill="#6F4E37"/>
    <!-- Foliage / Leaves -->
    <circle cx="30" cy="40" r="35" fill="#40916C"/>
    <circle cx="65" cy="20" r="40" fill="#52B788"/>
    <circle cx="95" cy="45" r="32" fill="#74C69D"/>
    <!-- Mulberry Berries (Quả dâu tím mọng) -->
    <circle cx="45" cy="55" r="5" fill="#5A189A"/>
    <circle cx="75" cy="45" r="5" fill="#7B2CBF"/>
    <circle cx="85" cy="65" r="4.5" fill="#9D4EDD"/>
  </g>

  <!-- Floating Cute Heritage Badge (1,000+ Năm Di Sản) -->
  <g transform="translate(40, 25)" filter="url(#softShadow)">
    <rect x="0" y="0" width="165" height="42" rx="21" fill="#FFFFFF" stroke="#FF5E7E" stroke-width="2.5"/>
    <circle cx="21" cy="21" r="14" fill="#FF5E7E"/>
    <text x="21" y="27" font-family="'Baloo 2', sans-serif" font-size="16" font-weight="900" fill="#FFF" text-anchor="middle">★</text>
    <text x="96" y="19" font-family="'Baloo 2', sans-serif" font-size="12" font-weight="900" fill="#E63946" text-anchor="middle">
      1.000+ NĂM
    </text>
    <text x="96" y="32" font-family="'Quicksand', sans-serif" font-size="9.5" font-weight="800" fill="#4A5568" text-anchor="middle">
      LÀNG NGHỀ DI SẢN
    </text>
  </g>

  <!-- 1946 Historical Note Badge -->
  <g transform="translate(460, 335)" filter="url(#softShadow)">
    <rect x="0" y="0" width="160" height="52" rx="12" fill="#FFF8F0" stroke="#B37D4E" stroke-width="2"/>
    <text x="80" y="22" font-family="'Baloo 2', sans-serif" font-size="11.5" font-weight="800" fill="#801313" text-anchor="middle">
      Vạn Phúc 12/1946 📜
    </text>
    <text x="80" y="38" font-family="'Quicksand', sans-serif" font-size="9" font-weight="700" fill="#555" text-anchor="middle">
      Lời kêu gọi Toàn quốc kháng chiến
    </text>
  </g>
</svg>
