<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8F8F5" />
      <stop offset="100%" stop-color="#D1F2EB" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="400" height="240" rx="16" fill="url(#bgGrad2)"/>
  
  <!-- Illustration: Shuttle passing through warp threads -->
  <g transform="translate(70, 35)" filter="url(#shadow)">
    <!-- Loom background slice -->
    <rect x="0" y="0" width="260" height="140" rx="12" fill="#FFFDF9" stroke="#00D2B4" stroke-width="3"/>
    
    <!-- Vertical Warp Threads -->
    <g stroke="#C5B49E" stroke-width="3">
      <line x1="40" y1="10" x2="40" y2="130"/>
      <line x1="70" y1="10" x2="70" y2="130"/>
      <line x1="100" y1="10" x2="100" y2="130"/>
      <line x1="130" y1="10" x2="130" y2="130"/>
      <line x1="160" y1="10" x2="160" y2="130"/>
      <line x1="190" y1="10" x2="190" y2="130"/>
      <line x1="220" y1="10" x2="220" y2="130"/>
    </g>

    <!-- Already woven rows -->
    <rect x="25" y="85" width="210" height="40" rx="3" fill="#FF5E7E"/>
    <line x1="25" y1="95" x2="235" y2="95" stroke="#FFF" stroke-width="1.5" stroke-dasharray="4,4"/>
    <line x1="25" y1="108" x2="235" y2="108" stroke="#FFF" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- Shuttle going over & under -->
    <path d="M 15 65 C 30 55, 230 55, 245 65 C 240 75, 20 75, 15 65 Z" fill="#ECC695" stroke="#8C5329" stroke-width="2.5"/>
    <circle cx="130" cy="65" r="7" fill="#00D2B4"/>
    <path d="M 235 65 Q 260 50 270 70" fill="none" stroke="#00D2B4" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Big Play Button Overlay -->
  <g transform="translate(200, 105)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="30" fill="#00D2B4"/>
    <polygon points="-8,-14 16,0 -8,14" fill="#FFFFFF"/>
  </g>

  <!-- Bottom Lesson Title Bar -->
  <rect x="0" y="195" width="400" height="45" fill="#2B2D42" opacity="0.9"/>
  <text x="20" y="215" font-family="'Baloo 2', sans-serif" font-size="14" font-weight="800" fill="#00D2B4">
    BÀI 2: LUỒN THOI KỲ DIỆU (DỆT TRƠN)
  </text>
  <text x="20" y="230" font-family="'Quicksand', sans-serif" font-size="10.5" font-weight="600" fill="#E2E8F0">
    Quy tắc thần kỳ: Đè 1 - Luồn 1 - Gạt chặt
  </text>

  <!-- Duration Badge -->
  <rect x="330" y="206" width="55" height="22" rx="11" fill="#00D2B4"/>
  <text x="357" y="221" font-family="'Baloo 2', sans-serif" font-size="11" font-weight="800" fill="#FFF" text-anchor="middle">
    06:15
  </text>
</svg>
